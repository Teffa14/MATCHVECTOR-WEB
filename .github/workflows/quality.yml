name: web-static-smoke

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "config.js"
      - "favicon.svg"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "config.js"
      - "favicon.svg"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
      - name: Check required static files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s config.js
          test -s favicon.svg
          grep -q "matchvector-api-teffa14.onrender.com" config.js
